# Harvest CISA KEV + OSINT feeds and publish static SOC CTI dashboard to GitHub Pages.
# Schedule: 07:00 & 15:00 Asia/Taipei  →  23:00 UTC (prev day) & 07:00 UTC

name: Deploy SOC CTI Dashboard

on:
  schedule:
    # 07:00 Asia/Taipei
    - cron: "0 23 * * *"
    # 15:00 Asia/Taipei
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "soc_cti_dashboard/**"
      - ".github/workflows/deploy-cti-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-cti
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanity checks (block bad deploys)
        working-directory: soc_cti_dashboard
        run: |
          node --check frontend/app.js
          node --check frontend/i18n.js
          python -m py_compile backend/*.py scripts/*.py
          pip install -q pytest
          PYTHONPATH=. python -m pytest tests/ -q

  build-and-deploy:
    needs: sanity
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soc_cti_dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r soc_cti_dashboard/requirements.txt

      - name: Harvest intel & export static JSON
        working-directory: soc_cti_dashboard
        run: python scripts/export_static.py
        env:
          PYTHONUNBUFFERED: "1"
          # Optional secrets (repo Settings → Secrets and variables → Actions)
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          EASM_WATCH_IPS: ${{ secrets.EASM_WATCH_IPS }}
          EASM_WATCH_HOSTS: ${{ secrets.EASM_WATCH_HOSTS }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          HIBP_WATCH_DOMAINS: ${{ secrets.HIBP_WATCH_DOMAINS }}
          RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r soc_cti_dashboard/frontend/* _site/
          # Marker for Pages root
          touch _site/.nojekyll
          ls -la _site
          ls -la _site/data || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
