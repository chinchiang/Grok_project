# Harvest CISA KEV + OSINT feeds and publish static SOC CTI dashboard to GitHub Pages.
# Schedule: 07:00 & 15:00 Asia/Taipei  →  23:00 UTC (prev day) & 07:00 UTC

name: Deploy SOC CTI Dashboard

on:
  schedule:
    # 07:00 Asia/Taipei
    - cron: "0 23 * * *"
    # 15:00 Asia/Taipei
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "soc_cti_dashboard/**"
      - ".github/workflows/deploy-cti-dashboard.yml"
  # Run the sanity gate on pull requests too. On push alone it only fired after
  # a merge, so a broken change was already on the default branch by the time
  # anything checked it — the gate could stop the deploy but not the mistake.
  # build-and-deploy stays off for pull requests (see its `if` below).
  pull_request:
    branches: [master, main]
    paths:
      - "soc_cti_dashboard/**"
      - ".github/workflows/deploy-cti-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-cti
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Only used for `node --check` below. Node 20 is end-of-life, and the
          # action bump would otherwise have left it as the last thing here
          # still pinned to it.
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soc_cti_dashboard/requirements.txt

      # Project deps, not just pytest: tests that touch collectors / main /
      # database need httpx, fastapi, aiosqlite and feedparser to import at all.
      - name: Install dependencies
        working-directory: soc_cti_dashboard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -q pytest pytest-asyncio

      - name: Sanity checks (block bad deploys)
        working-directory: soc_cti_dashboard
        run: |
          node --check frontend/app.js
          node --check frontend/i18n.js
          python -m py_compile backend/*.py scripts/*.py
          PYTHONPATH=. python -m pytest tests/ -q

  build-and-deploy:
    needs: sanity
    # Never publish from a pull request: it would push a branch's output to the
    # live Pages site and needs the github-pages environment.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Individual collectors time out at 45-120s but the harvest as a whole had
    # no ceiling: one hung feed could pin a runner until the job limit.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: soc_cti_dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r soc_cti_dashboard/requirements.txt

      # The runner is fresh every run, so without this the SQLite file starts
      # empty each time: 30-day trends collapse to whatever the feeds still
      # carry, and an item can never evolve from unverified to corroborated
      # across runs. restore-keys lets a new date-stamped key fall back to the
      # most recent previous database.
      - name: Restore intel database
        id: db-cache
        uses: actions/cache@v6
        with:
          path: soc_cti_dashboard/data
          key: cti-db-${{ github.run_id }}
          restore-keys: |
            cti-db-

      - name: Harvest intel & export static JSON
        working-directory: soc_cti_dashboard
        run: python scripts/export_static.py
        env:
          PYTHONUNBUFFERED: "1"
          # Optional secrets (repo Settings → Secrets and variables → Actions)
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          EASM_WATCH_IPS: ${{ secrets.EASM_WATCH_IPS }}
          EASM_WATCH_HOSTS: ${{ secrets.EASM_WATCH_HOSTS }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          HIBP_WATCH_DOMAINS: ${{ secrets.HIBP_WATCH_DOMAINS }}
          RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}

      - name: Report database carry-over
        working-directory: soc_cti_dashboard
        run: |
          if [ -f data/cti.db ]; then
            echo "cti.db size: $(du -h data/cti.db | cut -f1)"
            # cache-hit is the only output actions/cache declares; the
            # cache-matched-key used here before belongs to actions/cache/restore
            # and rendered as an empty string. It is false on a restore-keys
            # fallback, which is the normal case for this rolling key.
            echo "exact key hit: ${{ steps.db-cache.outputs.cache-hit }}"
          else
            echo "no cti.db present (first run)"
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r soc_cti_dashboard/frontend/* _site/
          # Marker for Pages root
          touch _site/.nojekyll
          ls -la _site
          ls -la _site/data || true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Hidden files are excluded by default, which would silently drop the
          # .nojekyll marker written above. Stated explicitly rather than left
          # to a default that has already changed once.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
