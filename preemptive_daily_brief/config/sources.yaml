# Tier 1–4 OSINT sources for the preemptive daily brief.
# Fetch scripts skip a source on HTTP failure and record it; they never invent items.

tier1:
  - id: cisa_kev
    name: CISA KEV Catalog
    kind: json
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    mirrors:
      - https://raw.githubusercontent.com/cisagov/kev-data/main/known_exploited_vulnerabilities.json
    purpose: 新增 KEV 條目＝最高優先訊號
  - id: first_epss
    name: FIRST EPSS
    kind: json
    url: https://api.first.org/data/v1/epss?days=1&percentile-gt=0.9
    purpose: 24 小時內 EPSS 大幅跳升／高百分位
  - id: nvd
    name: NVD API 2.0
    kind: json
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    purpose: 新增／更新 CVE、CVSS
  - id: cisa_ics
    name: CISA ICS Advisories
    kind: rss
    url: https://www.cisa.gov/cybersecurity-advisories/ics-advisories.xml
    purpose: OT/ICS 專區素材

