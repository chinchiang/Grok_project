# 本組織技術堆疊關鍵字 — 命中則優先級升一級並標〔本組織相關〕
# 臺灣 ODM/EMS 電子製造：企業 IT + 量產 OT/ICS + 產品資安 PSIRT/SBOM
# 營運據點：台灣／中國／美國／墨西哥／捷克
#
# 比對規則（lib/classify.py::keyword_regex）：ASCII 關鍵字以詞界錨定、CJK 以子字串、
# 純數字視為台股代號且須有市場語境。因為命中會「升一級」，關鍵字必須能唯一指向本組織
# 實際持有的資產 — 通用詞（Gateway、Exchange、ICS、Spring、Apache）即使加了詞界仍會
# 命中 "Check Point Security Gateway"、"IKEv1 key exchange"、"Spring cleaning"，
# 故一律改為帶廠商／產品限定的完整名稱。

org:
  name_zh: 臺灣 ODM/EMS 電子製造集團
  sites: [台灣, 中國, 美國, 墨西哥, 捷克]
  domains: [IT, OT, PSIRT]

assets:
  - key: fortigate
    keywords: [FortiGate, FortiOS, Fortinet, FortiManager, FortiProxy, FortiClient]
    owner: IT
    kind: perimeter
    sites: [台灣, 中國, 美國, 墨西哥, 捷克]
  - key: ivanti
    keywords: [Ivanti, Connect Secure, Policy Secure, Avalanche, Pulse Secure]
    owner: IT
    kind: vpn
    sites: [台灣, 美國]
  - key: paloalto
    keywords: [Palo Alto, PAN-OS, GlobalProtect, Cortex XDR]
    owner: IT
    kind: perimeter
    sites: [台灣, 美國]
  - key: cisco
    keywords: [Cisco IOS, Cisco ASA, Cisco ISE, Cisco NX-OS, AnyConnect]
    owner: IT
    kind: network
    sites: [台灣, 中國, 美國, 墨西哥, 捷克]
  - key: citrix
    keywords: [Citrix, NetScaler, Citrix ADC, NetScaler ADC, Citrix Gateway, NetScaler Gateway]
    owner: IT
    kind: remote_access
    sites: [台灣, 美國]
  - key: vmware
    keywords: [VMware, vCenter, ESXi, vSphere, Workspace ONE, Broadcom]
    owner: IT
    kind: virtualization
    sites: [台灣, 中國, 美國, 墨西哥, 捷克]
  - key: microsoft
    keywords: [Windows Server, Microsoft Exchange, Exchange Server, OWA, SharePoint, Entra, Azure AD, Defender, M365, Outlook]
    owner: IT
    kind: enterprise
    sites: [台灣, 中國, 美國, 墨西哥, 捷克]
  - key: sap
    keywords: [SAP, NetWeaver, S/4HANA, SAP GUI]
    owner: IT
    kind: erp
    sites: [台灣, 中國]
  - key: siemens
    keywords: [Siemens, SIMATIC, S7-1500, S7-1200, TIA Portal, WinCC, ProductCERT]
    owner: OT
    kind: plc
    sites: [台灣, 中國, 墨西哥, 捷克]
    iec62443: zone
  - key: rockwell
    keywords: [Rockwell, Allen-Bradley, FactoryTalk, ControlLogix, CompactLogix]
    owner: OT
    kind: plc
    sites: [墨西哥, 美國]
    iec62443: zone
  - key: schneider
    keywords: [Schneider, Modicon, EcoStruxure, Unity Pro]
    owner: OT
    kind: plc
    sites: [捷克, 墨西哥]
    iec62443: zone
  - key: ot_protocols
    keywords: [Modbus, OPC UA, EtherNet/IP, PROFINET, S7comm, DNP3, MQTT]
    owner: OT
    kind: protocol
    sites: [台灣, 中國, 美國, 墨西哥, 捷克]
    iec62443: conduit
  - key: scada
    # 裸 "ICS" 已移除：它是「這是一則 ICS 情資」的訊號，不是「本組織持有此資產」的證據，
    # 不該據以升一級。OT/ICS 版面路由仍由 classify.py::OT_HINTS 的 "ics" 負責，不受影響。
    keywords: [SCADA, HMI, PLC, DCS, 工業控制]
    owner: OT
    kind: ics
    sites: [台灣, 中國, 美國, 墨西哥, 捷克]
  - key: inventec
    keywords: [Inventec, 英業達, 2356]
    owner: PSIRT
    kind: brand
    sites: [台灣]
  - key: odm_ems
    keywords: [Quanta, 廣達, Compal, 仁寶, Wistron, 緯創, Pegatron, 和碩, Foxconn, 鴻海]
    owner: PSIRT
    kind: supply_chain
    sites: [台灣]
  - key: open_source
    # 單行：io_yaml.py 的 fallback parser 不支援跨行 flow list。
    keywords: [OpenSSL, Log4j, Log4Shell, Spring Framework, Spring Boot, Spring Cloud, Jenkins, GitLab, Apache HTTP Server, Apache Tomcat, Apache Struts, Apache Kafka, nginx, OpenSSH]
    owner: PSIRT
    kind: sbom
    sites: [台灣, 中國, 美國, 墨西哥, 捷克]
    cra: true
